[project]
site_name = "NumPy Vector Store"
site_url = "https://numpy-vector-store.tvr.works/"
site_description = "Exact, in-process vector search powered by NumPy. Install, search, filter, and persist with a small typed Python API."
site_author = "Tim VanReenen"
copyright = 'An open source project by <a href="https://tvr.works">TVR Works</a> · MIT licensed'
repo_url = "https://github.com/tvr-works/numpy-vector-store"
repo_name = "tvr-works/numpy-vector-store"
docs_dir = "docs"
site_dir = "site"
strict = true
dev_addr = "127.0.0.1:8000"
extra_css = ["assets/stylesheets/extra.css"]
nav = [
  { "Start here" = "index.md" },
  { "API reference" = "reference.md" },
]

[project.extra]
docs_version = "0.7.0"

[project.theme]
variant = "modern"
language = "en"
font = false
logo = "assets/logo.svg"
favicon = "assets/logo.svg"
features = [
  "content.code.copy",
  "navigation.expand",
  "navigation.footer",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "blue"
accent = "blue"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "blue"
accent = "blue"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.pygments_lang_class = true
pymdownx.superfences = {}
pymdownx.snippets.base_path = ["."]
pymdownx.snippets.check_paths = true

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
show_source = false
show_root_heading = true
show_root_full_path = false
show_signature_annotations = true
separate_signature = true
signature_crossrefs = false
line_length = 68
members_order = "source"
group_by_category = false
show_symbol_type_heading = true
