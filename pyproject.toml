[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "numpy-vector-store"
dynamic = ["version"]
description = "A fast, lightweight, and zero-setup in-memory vector store powered by NumPy"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Tim VanReenen"},
]
keywords = ["vector", "store", "numpy", "embeddings", "search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.23.2",
]


[project.urls]
Homepage = "https://github.com/tvr-works/numpy-vector-store"
Documentation = "https://vectors.tvr.works/"
Repository = "https://github.com/tvr-works/numpy-vector-store"
Issues = "https://github.com/tvr-works/numpy-vector-store/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/numpy_vector_store"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.codex",
    "/.venv-docs",
    "/.cache",
    "/site",
    "/docs",
    "/zensical.toml",
    "/DOCUMENTATION.md",
    "/tools/docs.py",
    "/tools/docs_gate.py",
    "/tools/docs_tests.py",
    "/tools/docs-env",
    "/.github/workflows/docs.yml",
]

[tool.hatch.version]
path = "src/numpy_vector_store/__init__.py"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["numpy_vector_store"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "pytest>=8.4.2",
    "pytest-cov>=4.0.0",
    "ruff>=0.13.3",
]
# Compatibility for the existing Pages bootstrap; tools live in tools/docs-env.
docs = []
