name: Publish to TestPyPI

on:
  workflow_dispatch:

concurrency:
  group: publish-testpypi
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate release candidate
    uses: ./.github/workflows/checks.yml

  publish-testpypi:
    name: Publish to TestPyPI
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/p/numpy-vector-store
    permissions:
      id-token: write

    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.validate.outputs.distributions-artifact-id }}
          path: dist

      - name: Publish package distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/
