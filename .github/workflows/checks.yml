name: Checks

on:
  workflow_call:
    inputs:
      release-tag:
        description: Optional v-prefixed tag that must match the distributions
        required: false
        type: string
        default: ""
    outputs:
      distributions-artifact-id:
        description: Artifact ID for the verified wheel and source distribution
        value: ${{ jobs.distributions.outputs.artifact-id }}
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, format, and type-check
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.13"
          enable-cache: true

      - name: Install project dependencies
        run: uv sync --locked --group dev

      - name: Run Ruff lint checks
        run: uv run --locked ruff check .

      - name: Check Ruff formatting
        run: uv run --locked ruff format --check .

      - name: Run mypy
        run: uv run --locked mypy src/ benchmarks/ tools/

  tests:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install project dependencies
        run: uv sync --locked --group dev

      - name: Run tests
        run: uv run --locked pytest

  windows:
    name: Test Windows on Python 3.13
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.13"
          enable-cache: true

      - name: Install project dependencies
        run: uv sync --locked --group dev

      - name: Run tests
        run: uv run --locked pytest

  minimum-numpy:
    name: Test minimum NumPy on Python 3.11
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.11"
          enable-cache: true

      - name: Run tests with the minimum NumPy version
        run: >-
          uv run
          --isolated
          --no-project
          --python 3.11
          --with-editable .
          --with numpy==1.23.2
          --with pytest==8.4.2
          python -m pytest

  distributions:
    name: Build and test distributions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.11"
          enable-cache: true

      - name: Build wheel and source distribution
        run: uv build --out-dir dist

      - name: Verify release versions
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            uv run --locked python tools/verify_release_version.py --tag "$RELEASE_TAG"
          else
            uv run --locked python tools/verify_release_version.py
          fi

      - name: Check distribution metadata
        run: uvx --from twine==7.0.0 twine check --strict dist/*

      - name: Test installed wheel
        run: >-
          uv run
          --isolated
          --no-project
          --python 3.11
          --with ./dist/*.whl
          python tools/verify_installed_distribution.py

      - name: Test installed source distribution
        run: >-
          uv run
          --isolated
          --no-project
          --python 3.11
          --with ./dist/*.tar.gz
          python tools/verify_installed_distribution.py

      - name: Upload verified distributions
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-distributions-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
